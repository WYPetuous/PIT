# general settings for image SR training
name: PIT_SR_x4
model_type: PITModel
scale: 4
num_gpu: auto
manual_seed: 10

# dataset and data loader settings
datasets:
  train:
    task: SR
    name: M3FD
    type: PairedImageDataset
    dataroot_gt: datasets/M3FD/train/HR
    dataroot_lq: datasets/M3FD/train/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val_1:
    name: val1
    type: PairedImageDataset
    dataroot_gt: #val gt datasets path
    dataroot_lq: #val lr datasets path
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

  val_2:
    name: val2
    type: PairedImageDataset
    dataroot_gt: #val gt datasets path
    dataroot_lq: #val lr datasets path
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

  val_3:
    name: val3
    type: PairedImageDataset
    dataroot_gt: #val gt datasets path
    dataroot_lq: #val lr datasets path
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

# network structures
network_g:
  type: PIT
  upscale: 4
  in_chans: 3
  img_size: 64
  window_size: 8
  img_range: 1.
  depths: [4, 4, 4, 4, 4, 4]  #[6, 6, 6, 6, 6, 6]
  interval: [4, 4, 4, 4, 4, 4]
  embed_dim: 150   #180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 4
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: experiments/PIT_SR_x2/models/net_g_latest.pth # save training time if we finetune from x2 and halve initial lr.
  strict_load_g: false
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    # lr: !!float 2e-4
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [ 125000, 200000, 225000, 237500 ]
    gamma: 0.5

  # total_iter: 500000
  total_iter: 250000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
# validation settings
val:
  val_freq: !!float 1e4
  save_img: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true


# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500